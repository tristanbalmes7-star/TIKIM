<!DOCTYPE html>
<html lang="en" class="planner-app-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Venue Floor Planner | Dack's Catering Services</title>
  <meta name="description" content="Plan and design your event venue layout with 0.5m grid snap, seating meter, item rotation, and export features.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Fraunces:ital,opsz,wght@0,9..144,600..900;1,9..144,600..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/planner.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <link rel="icon" type="image/png" href="assets/img/logo-main.png" />
</head>
<body data-page="planner" data-nav="fixed" class="planner-app-body">
  <a href="#plannerMount" class="skip-link">Skip to venue planner</a>
  <div id="tikim-header-slot"></div>

  <main id="plannerMount" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;"></main>

  <div id="tikim-footer-slot" style="display: none;"></div>

  <script type="module">
    import { initLayout } from './js/layout.js';
    import { TikimFloorPlanner } from './js/floorplan.js';
    import { getDraftQuote, saveDraftQuote } from './js/mockApi.js';

    let plannerInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      initLayout('planner');

      let initialItems = null;
      let initialPreset = 'medium';

      // Check URL hash for shared base64 layout
      if (window.location.hash.startsWith('#layout=')) {
        try {
          const rawB64 = window.location.hash.replace('#layout=', '');
          const decodedStr = atob(rawB64);
          const parsed = JSON.parse(decodedStr);
          if (parsed && Array.isArray(parsed.items)) {
            initialItems = parsed.items;
            if (parsed.venuePreset) initialPreset = parsed.venuePreset;
          }
        } catch (e) {
          console.warn('Could not parse shared layout from hash:', e);
        }
      }

      plannerInstance = new TikimFloorPlanner('#plannerMount', {
        pax: 80,
        venuePreset: initialPreset,
        initialItems: initialItems,
        isMini: false
      });

      // Expose to window for tests and assertions
      window.__TIKIM_PLANNER__ = plannerInstance;
      window.plannerInstance = plannerInstance;
    });
  </script>
  <script type="module" src="js/search.js"></script>
</body>
</html>
